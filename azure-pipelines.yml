# CI del motor (ADR-0008). Para validar PRs en Azure Repos, configurá la política
# de rama "Build validation" de main apuntando a este pipeline: el bloque `pr:`
# del YAML no aplica a Azure Repos.
# Usa agentes hospedados por Microsoft; para un pool propio, cambiá `pool`.

trigger:
  branches:
    include:
      - main

strategy:
  matrix:
    linux_py310:
      imageName: ubuntu-latest
      pythonVersion: "3.10"
    linux_py313:
      imageName: ubuntu-latest
      pythonVersion: "3.13"
    macos_py310:
      imageName: macOS-latest
      pythonVersion: "3.10"
    macos_py313:
      imageName: macOS-latest
      pythonVersion: "3.13"
    windows_py310:
      imageName: windows-latest
      pythonVersion: "3.10"
    windows_py313:
      imageName: windows-latest
      pythonVersion: "3.13"

pool:
  vmImage: $(imageName)

timeoutInMinutes: 15

steps:
  - task: UsePythonVersion@0
    displayName: Python $(pythonVersion)
    inputs:
      versionSpec: $(pythonVersion)

  - script: python -m pip install -e ".[dev]"
    displayName: Instalar

  - script: ruff check .
    displayName: Lint

  - script: pytest
    displayName: Tests con cobertura

  - script: exo validate
    displayName: Contenido del motor

  - bash: |
      a="$(exo --version)"
      b="$(python -m exo --version)"
      echo "exo --version: $a"
      echo "python -m exo --version: $b"
      test "$a" = "$b"
    displayName: Misma versión por CLI y por módulo
