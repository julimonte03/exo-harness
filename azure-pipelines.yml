# CI del motor (ADR-0008). Para validar PRs en Azure Repos, configurá la política
# de rama "Build validation" de main apuntando a este pipeline: el bloque `pr:`
# del YAML no aplica a Azure Repos.
# Usa agentes hospedados por Microsoft; para un pool propio, cambiá `pool`.

trigger:
  branches:
    include:
      - main

jobs:
  - job: tests
    displayName: Tests y lint
    timeoutInMinutes: 15
    strategy:
      matrix:
        linux_py310:
          imageName: ubuntu-latest
          pythonVersion: "3.10"
        linux_py313:
          imageName: ubuntu-latest
          pythonVersion: "3.13"
        macos_py310:
          imageName: macOS-latest
          pythonVersion: "3.10"
        macos_py313:
          imageName: macOS-latest
          pythonVersion: "3.13"
        windows_py310:
          imageName: windows-latest
          pythonVersion: "3.10"
        windows_py313:
          imageName: windows-latest
          pythonVersion: "3.13"
    pool:
      vmImage: $(imageName)
    steps:
      - task: UsePythonVersion@0
        displayName: Python $(pythonVersion)
        inputs:
          versionSpec: $(pythonVersion)

      - script: python -m pip install -e ".[dev]"
        displayName: Instalar

      - script: ruff check .
        displayName: Lint

      - script: pytest
        displayName: Tests con cobertura

      - script: exo validate
        displayName: Contenido del motor

      - bash: |
          a="$(exo --version)"
          b="$(python -m exo --version)"
          echo "exo --version: $a"
          echo "python -m exo --version: $b"
          test "$a" = "$b"
        displayName: Misma versión por CLI y por módulo

  # F3: la memoria con los extras (sqlite-vec, model2vec, FastEmbed). Sin modelos bajados:
  # los tests que los necesitan se saltean.
  - job: memory_extras
    displayName: Memoria con extras
    timeoutInMinutes: 20
    strategy:
      matrix:
        linux:
          imageName: ubuntu-latest
        windows:
          imageName: windows-latest
    pool:
      vmImage: $(imageName)
    steps:
      - task: UsePythonVersion@0
        displayName: Python 3.13
        inputs:
          versionSpec: "3.13"

      - script: python -m pip install -e ".[dev,vector,onnx]"
        displayName: Instalar con extras

      - script: pytest --no-cov tests/test_memory_store.py tests/test_memory_semantic.py tests/test_memory_providers.py tests/test_cli_memory.py
        displayName: Tests de memoria

  # Criterio 1 de F2: los instaladores de un comando en un HOME temporal.
  - job: installers
    displayName: Instaladores de un comando
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          imageName: ubuntu-latest
        macos:
          imageName: macOS-latest
        windows:
          imageName: windows-latest
    pool:
      vmImage: $(imageName)
    steps:
      - task: UsePythonVersion@0
        displayName: Python 3.13
        inputs:
          versionSpec: "3.13"

      - script: python -m pip install -e ".[dev]"
        displayName: Instalar dependencias de desarrollo

      - script: pytest -m installer --no-cov
        displayName: install.sh / install.ps1 y sus desinstaladores
