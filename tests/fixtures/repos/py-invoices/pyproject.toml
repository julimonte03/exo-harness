[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "py-invoices"
version = "1.4.0"
description = "Invoicing API: customers, invoices, card payments and reconciliation."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
invoices = "invoices.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
