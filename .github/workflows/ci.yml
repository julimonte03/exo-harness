# CI del motor (ADR-0017, D-45): Windows, macOS y Linux con Python 3.10 a 3.13.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Identidad de git para los repos temporales de los tests
        run: |
          git config --global user.name "exo CI"
          git config --global user.email "ci@example.com"

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests con cobertura
        run: pytest

      - name: Contenido del motor
        run: exo validate

      - name: Misma versión por CLI y por módulo
        shell: bash
        run: |
          a="$(exo --version)"
          b="$(python -m exo --version)"
          echo "exo --version: $a"
          echo "python -m exo --version: $b"
          test "$a" = "$b"

  # F3: la memoria con los extras (sqlite-vec, model2vec, FastEmbed). Sin modelos bajados:
  # los tests que los necesitan se saltean. En macOS, un Python sin carga de extensiones de
  # SQLite tiene que degradar con un mensaje claro.
  memory_extras:
    name: Memoria con extras (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Instalar con extras
        run: python -m pip install -e ".[dev,vector,static]"

      - name: Tests de memoria
        run: pytest --no-cov tests/test_memory_store.py tests/test_memory_semantic.py tests/test_memory_providers.py tests/test_cli_memory.py

  # Criterio 1 de F2: los instaladores de un comando en un HOME temporal.
  installers:
    name: Instaladores (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Con la instalación remota simulada (F8), Windows tarda más de 10 min.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Identidad de git
        run: |
          git config --global user.name "exo CI"
          git config --global user.email "ci@example.com"

      - name: Instalar dependencias de desarrollo
        run: python -m pip install -e ".[dev]"

      - name: install.sh / install.ps1 y sus desinstaladores
        run: pytest -m installer --no-cov

  # El paquete que se publica: wheel y sdist, instalados en un venv limpio.
  build:
    name: Build del paquete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build

      # Como en release.yml: un README o metadatos rotos fallan en el PR, no en el tag.
      - name: Metadatos y descripción válidos para PyPI
        run: twine check --strict dist/*

      - name: El wheel instalado trae su contenido
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/exo --version
          /tmp/wheel-venv/bin/exo validate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
