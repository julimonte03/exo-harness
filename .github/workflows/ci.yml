name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests con cobertura
        run: pytest

      - name: Misma versión por CLI y por módulo
        shell: bash
        run: |
          a="$(exo --version)"
          b="$(python -m exo --version)"
          echo "exo --version: $a"
          echo "python -m exo --version: $b"
          test "$a" = "$b"
