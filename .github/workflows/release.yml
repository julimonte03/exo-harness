# Release del motor (ADR-0017). Un tag vX.Y.Z:
#   1. verifica que el tag coincida con _meta.VERSION;
#   2. arma el wheel y el sdist, los revisa con twine y prueba el wheel en un venv limpio;
#   3. escribe SHA256SUMS (install.sh e install.ps1 verifican el wheel contra él);
#   4. crea el release de GitHub con los artefactos y SHA256SUMS;
#   5. publica en PyPI por trusted publishing: sin tokens guardados en el repo.
# A mano (Actions > Release > Run workflow), el mismo build se publica en TestPyPI
# como ensayo, sin release de GitHub ni PyPI.
#
# Lo que el dueño configura una vez, antes del primer tag:
#
# 1. En el repo, Settings > Environments:
#    - `pypi`: "Required reviewers" con el dueño (aprueba cada publicación) y
#      "Deployment branches and tags" limitado al patrón de tags `v*`.
#    - `testpypi`: sin reglas, o limitado a las ramas desde las que se ensaya.
# 2. En https://pypi.org/manage/account/publishing/, "Add a new pending publisher":
#    PyPI Project Name `exo-harness`, Owner `julimonte03`, Repository name
#    `exo-harness`, Workflow name `release.yml`, Environment name `pypi`. El proyecto
#    se crea con la primera publicación.
# 3. Lo mismo en https://test.pypi.org/manage/account/publishing/ (TestPyPI tiene
#    cuentas aparte), con Environment name `testpypi`.
#
# Sin el paso 2 falla solo el job de PyPI: el release de GitHub sale igual, porque son
# jobs independientes. El ensayo y el release necesitan README.md declarado como
# `readme` en pyproject.toml: `twine check --strict` falla sin descripción larga.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, checksums y prueba del wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: El tag coincide con _meta.VERSION
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(PYTHONPATH=src python -c 'from exo._meta import VERSION; print(VERSION)')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match _meta.VERSION ($version). Tag v$version, or bump the version first."
            exit 1
          fi

      - name: Build del wheel y el sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Metadatos y descripción válidos para PyPI
        run: twine check --strict dist/*

      - name: El wheel instalado en un venv limpio trae su contenido
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/exo --version
          /tmp/wheel-venv/bin/exo validate

      # Fuera de dist/: la acción de PyPI sube todo lo que hay ahí.
      - name: SHA256SUMS
        run: |
          (cd dist && sha256sum -- *.whl *.tar.gz) > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums
          path: SHA256SUMS
          if-no-files-found: error

  github-release:
    name: Release de GitHub
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Para las notas, que salen de CHANGELOG.md.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sha256sums
          path: .

      - name: Crear el release con los artefactos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Las notas son la sección de la versión en CHANGELOG.md ("## [1.0.0] - fecha"
          # o "## 1.0.0"); si no está, las arma GitHub con los commits.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          args=(--title "$TAG" --verify-tag)
          if [ -s notes.md ]; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          case "$version" in
            *a*|*b*|*rc*|*dev*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* SHA256SUMS "${args[@]}"

  pypi:
    name: PyPI
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/exo-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi:
    name: Ensayo en TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/exo-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI no deja volver a subir una versión: un segundo ensayo de la misma
          # versión la saltea en vez de fallar. Para ensayar de nuevo la subida, hace
          # falta otra versión (por ejemplo 1.0.0rc2).
          skip-existing: true
