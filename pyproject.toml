[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# Distribución "exo-harness" para no chocar con otros proyectos llamados "exo"
# (ADR-0001). El paquete importable y el CLI se llaman `exo`.
name = "exo-harness"
dynamic = ["version"]
description = "Motor de desarrollo gobernado por proyecto, agnóstico del agente de IA."
requires-python = ">=3.10"
authors = [{ name = "Julian Monte" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
# Núcleo solo con biblioteca estándar (invariante 4 de 02-ARQUITECTURA §2.13, ADR-0002).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# Memoria semántica (F3, ADR-0009 y ADR-0010): sqlite-vec en la misma base y embeddings
# ONNX en CPU con FastEmbed, la combinación que ganó el experimento.
vector = ["sqlite-vec>=0.1.6", "fastembed>=0.4"]
# Alternativa con embeddings estáticos (model2vec).
static = ["sqlite-vec>=0.1.6", "model2vec>=0.4"]

[project.scripts]
exo = "exo.cli:main"

[tool.hatch.version]
path = "src/exo/_meta.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exo"]

# El contenido canónico viaja dentro del paquete (exo.content lo busca ahí).
[tool.hatch.build.targets.wheel.force-include]
"content" = "exo/_content"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `pytest` mide cobertura y aplica el umbral de [tool.coverage.report].
# Para correr un archivo suelto sin umbral: `pytest --no-cov tests/test_x.py`.
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not agent_e2e and not installer",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "agent_e2e: usa agentes reales o red; excluido de la suite normal",
    "installer: corre los instaladores de verdad (red); usar pytest -m installer --no-cov",
]

[tool.coverage.run]
source = ["exo"]
branch = true

[tool.coverage.report]
# 80 % en F0; 85 % desde F1.
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tablas de casos en tests: se privilegia una fila por caso.
"tests/**" = ["E501"]
