[build-system]
# 1.27: `license` como expresión SPDX y `license-files` (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribución "exo-harness" para no chocar con otros proyectos llamados "exo"
# (ADR-0001). El paquete importable y el CLI se llaman `exo`.
name = "exo-harness"
dynamic = ["version"]
# En inglés: es lo que se lee en PyPI (D-48).
description = "Project-governed development engine, agnostic of the AI coding agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Julian Monte" }]
# MIT (decisión del dueño, 2026-11-22): el código es suyo y open source.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Núcleo solo con biblioteca estándar (invariante 4 de 02-ARQUITECTURA §2.13, ADR-0002).
dependencies = []

[project.urls]
Homepage = "https://github.com/julimonte03/exo-harness"
Repository = "https://github.com/julimonte03/exo-harness"
Issues = "https://github.com/julimonte03/exo-harness/issues"
Changelog = "https://github.com/julimonte03/exo-harness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# Memoria semántica (F3, ADR-0009 y ADR-0010): sqlite-vec en la misma base y embeddings
# ONNX en CPU con FastEmbed, la combinación que ganó el experimento.
vector = ["sqlite-vec>=0.1.6", "fastembed>=0.4"]
# Alternativa con embeddings estáticos (model2vec).
static = ["sqlite-vec>=0.1.6", "model2vec>=0.4"]

[project.scripts]
exo = "exo.cli:main"

[tool.hatch.version]
path = "src/exo/_meta.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exo"]

# El contenido canónico viaja dentro del paquete (exo.content lo busca ahí).
[tool.hatch.build.targets.wheel.force-include]
"content" = "exo/_content"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# tests/fixtures/ tiene proyectos de prueba con sus propios tests (toy-python): no son de la suite.
norecursedirs = [".*", "build", "dist", "*.egg", "venv", ".venv", "fixtures"]
# `pytest` mide cobertura y aplica el umbral de [tool.coverage.report].
# Para correr un archivo suelto sin umbral: `pytest --no-cov tests/test_x.py`.
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not agent_e2e and not installer",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "agent_e2e: usa agentes reales o red; excluido de la suite normal",
    "installer: corre los instaladores de verdad (red); usar pytest -m installer --no-cov",
    "perf: metas de rendimiento de F8; corre en la suite normal y falla con el doble de la meta",
]

[tool.coverage.run]
source = ["exo"]
branch = true

[tool.coverage.report]
# 80 % en F0; 85 % desde F1.
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Los repos de prueba de la ingeniería inversa imitan proyectos ajenos: no se lintean.
extend-exclude = ["tests/fixtures/repos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tablas de casos en tests: se privilegia una fila por caso.
"tests/**" = ["E501"]
